<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Past expense reports</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f9fafb;
    color: #111827;
  }
  .shell { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 22px; }
  .nav-back { font-size: 13px; color: #2563eb; text-decoration: none; }
  .nav-back:hover { text-decoration: underline; }
  .filter-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 18px;
    padding: 12px 14px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
  }
  .filter-row label { font-size: 13px; color: #374151; }
  .filter-row input {
    padding: 6px 8px;
    font-size: 13px;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    width: 200px;
    font-family: ui-monospace, monospace;
  }
  .filter-row button {
    padding: 6px 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }
  .filter-row .clear-link {
    font-size: 12px;
    color: #6b7280;
    text-decoration: none;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    overflow: hidden;
  }
  th, td { text-align: left; padding: 10px 14px; font-size: 13px; }
  th { background: #f3f4f6; font-weight: 600; color: #374151; border-bottom: 1px solid #e5e7eb; }
  tr:nth-child(even) td { background: #fafbfc; }
  tr:hover td { background: #eff6ff; }
  td.right { text-align: right; font-variant-numeric: tabular-nums; }
  td a { color: #2563eb; text-decoration: none; font-family: ui-monospace, monospace; font-size: 12px; }
  td a:hover { text-decoration: underline; }
  .muted { color: #6b7280; }
  .empty {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 32px;
    text-align: center;
    color: #6b7280;
  }
  .empty p { margin: 4px 0; }
  .count-note { font-size: 12px; color: #6b7280; margin: 14px 0 0; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Past expense reports __SCOPE_LABEL__</h1>
    <a class="nav-back" href="/">← New upload</a>
  </header>

  <form class="filter-row" method="GET" action="/history">
    <label for="sunet-filter">Filter by payee SUNet:</label>
    <input type="text" id="sunet-filter" name="sunet" value="__SUNET__"
           placeholder="e.g. abc123" pattern="[A-Za-z0-9_\-]{2,16}">
    <button type="submit">Filter</button>
    <a class="clear-link" href="/history">(clear)</a>
  </form>

  __TABLE_HTML__

  <p class="count-note">__COUNT_NOTE__</p>
</div>
</body>
</html>
