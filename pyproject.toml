[project]
name = "expense-reports"
version = "0.1.0"
description = "AI-assisted expense-report extraction for Stanford Faculty Administrators."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "flask",
    "gunicorn",
    "google-genai",
    "google-cloud-documentai",
    "google-cloud-firestore",
    "google-cloud-storage",
    "pyyaml",
    "pillow-heif",
]

[dependency-groups]
dev = [
    "playwright",
]

[tool.uv]
package = false
