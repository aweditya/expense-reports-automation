conditional_rules:
- rule_type: depends_on
  target_path: expense_report.general_information.student_certification
  depends_on: *id001
- rule_type: depends_on
  target_path: expense_report.general_information.student_certification.integral_to_degree_work
  depends_on: *id002
- rule_type: required_when
  target_path: expense_report.general_information.student_certification.other_explanation
  expression: student_certification.other == true
- rule_type: validation_expression
  target_path: expense_report.transaction_lines[].common.date
  expression: Must fall within trip date window
- rule_type: required_when
  target_path: expense_report.transaction_lines[].common.original_currency
  expression: expense_type in [airfare_foreign, gift_card_employee_foreign, gifts_foreign_activity, ground_transportation_foreign,
    lodging_foreign]
- rule_type: required_when
  target_path: expense_report.transaction_lines[].common.original_amount
  expression: expense_type in [airfare_foreign, gift_card_employee_foreign, gifts_foreign_activity, ground_transportation_foreign,
    lodging_foreign]
- rule_type: required_when
  target_path: expense_report.transaction_lines[].common.exchange_rate
  expression: expense_type in [airfare_foreign, gift_card_employee_foreign, gifts_foreign_activity, ground_transportation_foreign,
    lodging_foreign]
- rule_type: required_when
  target_path: expense_report.transaction_lines[].common.country_of_activity
  expression: expense_type in [airfare_foreign, gift_card_employee_foreign, gifts_foreign_activity, ground_transportation_foreign,
    lodging_foreign]
- rule_type: required_when
  target_path: expense_report.transaction_lines[].common.foreign_activity_type
  expression: expense_type in [airfare_foreign, gift_card_employee_foreign, gifts_foreign_activity, ground_transportation_foreign,
    lodging_foreign]
- rule_type: required_when
  target_path: expense_report.transaction_lines[].airfare_details
  expression: expense_type in [airfare_domestic, airfare_foreign]
- rule_type: required_when
  target_path: expense_report.transaction_lines[].lodging_details
  expression: expense_type in [lodging_domestic, lodging_foreign]
- rule_type: required_when
  target_path: expense_report.transaction_lines[].lodging_details.shared_with_transaction_number
  expression: lodging_details.is_shared_lodging == true
- rule_type: required_when
  target_path: expense_report.transaction_lines[].ground_transport_details
  expression: expense_type in [ground_transportation_foreign, ground_transportation_domestic]
- rule_type: required_when
  target_path: expense_report.transaction_lines[].conference_registration_details
  expression: expense_type == conference_registration
- rule_type: required_when
  target_path: expense_report.transaction_lines[].meal_details
  expression: expense_type in [business_meal, group_travel_meal]
- rule_type: required_when
  target_path: expense_report.transaction_lines[].meal_details.alcohol_amount
  expression: meal_details.has_alcohol_on_receipt == true
- rule_type: required_when
  target_path: expense_report.transaction_lines[].car_rental_details
  expression: expense_type == car_rental
- rule_type: required_when
  target_path: expense_report.transaction_lines[].gift_details
  expression: expense_type in [gift_card_employee_foreign, gifts_foreign_activity]
- rule_type: required_when
  target_path: expense_report.transaction_lines[].human_subject_details
  expression: expense_type == human_subject_incentive
- rule_type: required_when
  target_path: expense_report.per_diem_expenses[].foreign_activity_type
  expression: expense_type in [international_lodging, international_meals]
- rule_type: required_when
  target_path: expense_report.allocation_and_approvers.beneficiary_list
  expression: allocation_and_approvers.other_beneficiaries == true
